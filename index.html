<head>
<script src="https://kit.fontawesome.com/610c820504.js" crossorigin="anonymous"></script>

<style type="text/css">
/*-------MUSIC PLAYER BY GLENTHEMES-------*/
#glenplayer02 {
position:relative;

#container07;
bottom:0;
margin-bottom:10px;
left:-8.5px;
margin-left:10px;
display:flex;
z-index:99;
}
#glenplayer02 a {
text-decoration:none;
}

#glenplayer02 > div {
align-self:center;
-webkit-align-self:center;
}

.music-controls {
user-select:none;
-webkit-user-select:none;
width:22px;
font-size:16px;
cursor:pointer;
}

.playy, .pausee {
-webkit-background-clip: text;
-webkit-text-fill-color: #color ;
-webkit-text-stroke-width: 1px;
-webkit-text-stroke-color: #color;
font-size: 22px;
}

.pausee {
display:none;
}

</style>
<body>
<!-------MUSIC PLAYER BY GLENTHEMES------->
<div id="glenplayer02">

<div class="music-controls" onclick="songstart();">
<div class="playy" style="display: block;"><span><i class="fa-solid fa-volume-low" aria-hidden="true"></i></span></div>
<div class="pausee" style="display: none;"><span><i class="fa-solid fa-volume-high" aria-hidden="true"></i></span></div></div>
</div>

<audio id="tune" src=""></audio>
</body>
