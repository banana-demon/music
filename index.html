<script src="//static.tumblr.com/gtjt4bo/QRmphdsdv/glenplayer02.js"></script>

<style type="text/css">
/*-------MUSIC PLAYER BY GLENTHEMES-------*/
#glenplayer02 {
 position:fixed;
 bottom:0;margin-bottom:20px;
 left:0;margin-left:20px;
 display:flex;
 z-index:99;
}
#glenplayer02 a {text-decoration:none;}

#glenplayer02 > div {
 align-self:center;
 -webkit-align-self:center;
}

.music-controls {
 user-select:none;
 -webkit-user-select:none;
 width:13px;
 font-size:13px;
 cursor:pointer;
}

.playy, .pausee {color:#000;} /* color of play & pause buttons */

.pausee {display:none;}

.sonata {
 margin-left:10px;
 color:#222; /* color of music note symbol */
}

.labeltext {
 margin-left:8px;
 font-family:courier new;
 font-size:9px;
 color:#222; /* color of song title */
}

</style>
<body>
<!-------MUSIC PLAYER BY GLENTHEMES------->
<div id="glenplayer02">
 <div class="music-controls" onclick="songstart();">
 <div class="playy">►</div>
 <div class="pausee">❚❚</div>
 </div> 
 <div class="sonata"> </div>
 <div class="labeltext"> song name </div>
</div><!--end music player--> 

<audio id="tune" src="https://dl.dropbox.com/s/22he1ckywvszvcw/Click.mp3"audio"></audio>
</body>
